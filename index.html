<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StackCity</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fb;--card:#fff;--ink:#1d2340;--mut:#6b7392;--acc:#6c5ce7;--m:#22c55e;--h:#ff5d73;--p:#ffb800;--s:#3b82f6}
@media(prefers-color-scheme:dark){:root{--bg:#12152a;--card:#1d2140;--ink:#eef0ff;--mut:#9aa1c7}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:600 16px Nunito,system-ui,sans-serif}
main{max-width:520px;margin:auto;padding:16px 14px 110px}
h1{font-size:2.6rem;font-weight:900;margin:6px 0}h1 span{color:var(--acc)}h2,h3{margin:14px 0 6px}
.mut{color:var(--mut);font-size:.9rem}
.card{background:var(--card);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 2px 0 rgba(0,0,0,.08)}
input{width:100%;padding:11px 12px;margin:6px 0;border:2px solid rgba(128,138,180,.35);border-radius:12px;font:inherit;background:transparent;color:inherit}
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:14px;padding:12px 16px;font:900 1rem Nunito,sans-serif;cursor:pointer}
.btn.sm{padding:8px 14px}.btn.big{width:100%;font-size:1.25rem;padding:16px}.btn[disabled]{opacity:.4}.btn.ghost{background:transparent;color:var(--acc);border:2px solid var(--acc)}
.row{display:flex;gap:8px;align-items:center}.row input{flex:1}.pl{display:flex;align-items:center;gap:10px;justify-content:space-between;margin:6px 0}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;margin-right:8px}
.em{font-size:1.5rem;background:none;border:2px solid transparent;border-radius:12px;cursor:pointer}.em.on{border-color:var(--acc)}
.top{display:flex;justify-content:space-between;align-items:center}.age{font-size:1.8rem;font-weight:900}.cash{font-size:1.5rem;font-weight:900}
.bar{display:flex;align-items:center;gap:8px;margin:9px 0}.bar span{width:116px}.bar div{flex:1;height:12px;background:rgba(128,138,180,.25);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;transition:width .4s}
.ev p{font-size:1.1rem;margin:0 0 10px}.ch{display:block;width:100%;margin:6px 0;background:var(--s)}
.feed{max-height:34vh;overflow:auto}.feed p{margin:0 0 8px}.feed b{color:var(--acc);margin-right:6px}
.chip{display:inline-block;border:2px solid;border-radius:18px;padding:4px 10px;margin:3px;font-size:.85rem}.chip i{display:block;font-style:normal;color:var(--mut);font-size:.72rem}.chip.rdy{background:rgba(34,197,94,.18)}.chip.dead{opacity:.5}
.bb{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--card);padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.12);text-align:center}
.chat{max-height:150px;overflow:auto;font-size:.9rem}.chat b{color:var(--acc)}
#banner{background:var(--h);color:#fff;border-radius:12px;padding:10px;margin:8px 0}.sc{font-size:1.4rem}
</style></head><body><main>
<div id="banner" hidden></div>
<section id="s-lobby"><h1>Stack<span>City</span></h1><p class="mut">Live a whole life with your friends. Stack cash. Ruin each other.</p>
<div class="card"><b>Your name</b><input id="name" maxlength="20" placeholder="Pick a name"><div id="emojis"></div></div>
<div class="card"><b>Host a party</b><input id="pname" maxlength="30" placeholder="Party name"><label class="mut">Game length: <b id="lenv">40</b> years</label><input id="len" type="range" min="10" max="80" step="5" value="40"><button class="btn" id="mk">Host party</button></div>
<h3>Open parties</h3><div id="plist" class="card mut">Loading…</div></section>
<section id="s-room" hidden><h2 id="rname"></h2><div id="rplayers" class="card"></div>
<div class="row"><button class="btn" id="start">Start game</button><button class="btn ghost" id="leave">Leave</button></div><h3>Party chat</h3><div id="slot-room"></div></section>
<section id="s-game" hidden><div class="card top"><div><div class="mut" id="jobl"></div><div class="age" id="agel"></div></div><div class="cash" id="cash"></div></div>
<div class="card" id="bars"></div><div id="evc" class="card ev" hidden></div><div class="card feed" id="feed"></div><div class="card" id="roster"></div>
<h3>Party chat</h3><div id="slot-game"></div>
<div class="bb"><button class="btn big" id="next">Next year</button><div id="cd" class="mut"></div></div></section>
<section id="s-end" hidden><h2>Final scores</h2><div id="rank"></div><div class="card" id="obit"></div><button class="btn" id="home">Back to lobby</button></section>
<div id="chatwrap"><div id="chat" class="chat card"></div><div class="row"><input id="cin" maxlength="280" placeholder="Say something"><button class="btn sm" id="csend">Send</button></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="events.js"></script>
<script>
const C=window.STACKCITY,$=s=>document.querySelector(s),LS=localStorage;
const EM=['😎','🤠','🦊','🐸','👽','🤖','🧙','🦄'],COL=['#6c5ce7','#e17055','#00b894','#0984e3','#fd79a8','#fdcb6e','#d63031','#00cec9'];
let sb,me,party,players=[],st,ch,ev,lastY=-1,flipping=false,emoji=+LS.emoji||0;
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v)),money=n=>(n<0?'-$':'$')+Math.abs(Math.round(n)).toLocaleString();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const show=id=>document.querySelectorAll('section').forEach(s=>s.hidden=s.id!==id),say=m=>{$('#banner').textContent=m;$('#banner').hidden=!m};
const run=q=>q.then(r=>{if(r&&r.error)say(r.error.message);return r}),mine=()=>players.find(p=>p.user_id===me),key=()=>({party_id:party.id,user_id:me});
const fresh=()=>({age:0,m:500,h:80,p:70,s:50,inc:0,job:'Baby',seen:[],log:[]});
const ensure=()=>{if(!st)st=LS['st'+party.id]?JSON.parse(LS['st'+party.id]):fresh()};
const save=()=>{if(party&&st){LS['st'+party.id]=JSON.stringify(st);run(sb.from('player_private').upsert({...key(),state:st}))}};
const nm=()=>$('#name').value.trim().slice(0,20);
function drawEm(){$('#emojis').innerHTML=EM.map((e,i)=>`<button class="em ${i===emoji?'on':''}" data-e="${i}">${e}</button>`).join('')}
async function init(){
 if(!C||C.SUPABASE_URL.includes('YOUR-'))return say('Open config.js and paste your Supabase URL and anon key.');
 sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
 let s=(await sb.auth.getSession()).data.session;
 if(!s){const r=await sb.auth.signInAnonymously();if(r.error)return say('Turn on anonymous sign-ins in Supabase (Authentication > Sign In / Providers). '+r.error.message);s=r.data.session}
 me=s.user.id;$('#name').value=LS.name||'';drawEm();show('s-lobby');run(sb.rpc('cleanup_stale'));lobby();
 setInterval(()=>{if(!$('#s-lobby').hidden)lobby()},4000);setInterval(host,1000);
 if(LS.party){const{data:p}=await sb.from('parties').select('id,status').eq('id',LS.party).maybeSingle();p&&p.status!=='ended'?enter(p.id):delete LS.party}}
async function lobby(){const{data}=await sb.from('parties').select('id,name,end_age,players(count)').eq('status','lobby').order('created_at',{ascending:false}).limit(20);
 $('#plist').innerHTML=(data||[]).map(p=>`<div class="pl"><div><b>${esc(p.name)}</b><div class="mut">${p.players[0].count}/8 players, ${p.end_age} years</div></div><button class="btn sm" data-j="${p.id}">Join</button></div>`).join('')||'No open parties yet. Host one!'}
async function join(id){const n=nm();if(!n)return say('Pick a name first.');LS.name=n;
 const{data:pl}=await sb.from('players').select('user_id').eq('party_id',id);
 if(pl.length>=8&&!pl.some(x=>x.user_id===me))return say('That party is full.');
 const{error}=await sb.from('players').upsert({party_id:id,user_id:me,name:n,emoji:EM[emoji],color:COL[emoji]});
 if(error)return say(error.message);say('');enter(id)}
async function enter(id){LS.party=id;party=(await sb.from('parties').select('*').eq('id',id).single()).data;
 ch=sb.channel('p'+id).on('postgres_changes',{event:'*',schema:'public',table:'parties',filter:'id=eq.'+id},x=>{if(x.eventType==='DELETE')return leave(true);party=x.new;route()})
 .on('postgres_changes',{event:'*',schema:'public',table:'players',filter:'party_id=eq.'+id},loadPlayers)
 .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat',filter:'party_id=eq.'+id},x=>addChat(x.new)).subscribe();
 const{data:c}=await sb.from('chat').select('*').eq('party_id',id).order('id').limit(50);$('#chat').innerHTML='';(c||[]).forEach(addChat);
 await loadPlayers();route()}
async function loadPlayers(){const{data}=await sb.from('players').select('*').eq('party_id',party.id).order('joined_at');players=data||[];draw()}
function route(){if(!party)return;
 if(party.status==='lobby'){show('s-room');$('#slot-room').append($('#chatwrap'))}
 else if(party.status==='playing'){show('s-game');$('#slot-game').append($('#chatwrap'));ensure();tickYear()}
 else{show('s-end');ensure();finalize()}
 draw()}
function tickYear(){if(st.dead)lastY=party.year;else{
 if(!ev&&st.ev)ev=EVENTS.find(e=>e.id===st.ev);
 if(party.year!==lastY){lastY=party.year;if(st.age!==party.year||!st.log.length)newYear(party.year)}}
 save();drawGame()}
const log=t=>{st.log.unshift({y:st.age,t});st.log.length=Math.min(st.log.length,60)};
function fx(o){for(const k in o){if(k==='job')st.job=o[k];else if(k==='inc')st.inc=o[k];else if(k==='m')st.m+=o[k];else st[k]=clamp(st[k]+o[k])}}
function pick(y){const ok=e=>y>=e.a[0]&&y<=e.a[1]&&!st.seen.includes(e.id)&&(!e.if||e.if(st));
 const must=EVENTS.filter(e=>e.must&&ok(e));if(must.length)return must[0];
 const pool=EVENTS.filter(e=>!e.must&&ok(e));return pool.length&&Math.random()<.85?pool[Math.floor(Math.random()*pool.length)]:null}
function newYear(y){st.age=y;const L=[];
 if(y>0){const col=y>=18&&st.job!=='Student'?12000:0;st.m+=st.inc-col;if(st.inc||col)L.push(`Earned ${money(st.inc)}, living costs ${money(col)}.`);if(y>45)st.h=clamp(st.h-Math.ceil((y-45)/12))}
 const w=party.world;if(w&&w.y===y&&WORLD[w.i]){const e=WORLD[w.i];fx(e.fx);L.push((e.abs?'🛸 ':'🌍 ')+e.t)}
 ev=pick(y);st.ev=ev&&ev.id;if(ev)st.seen.push(ev.id);
 if(!ev&&!L.length)L.push(y<5?'You were a baby. Impressive.':'A quiet year. Suspicious.');
 L.forEach(log);if(y===0)log('👶 Born in StackCity. Everyone starts equal. It won\'t last.');
 if(st.h<=0)die('poor health');pub()}
function pickChoice(i){const c=ev.c[i];let f=c[1],t=c[2];if(c[3]&&Math.random()<c[3][0]){f=c[3][1];t=c[3][2]}
 fx(f);log(ev.t+'\n→ '+c[0]+': '+t);ev=null;st.ev=null;if(st.h<=0)die('poor health');pub();save();drawGame()}
function die(c){if(st.dead)return;st.dead=true;st.cause=c;log('💀 You died ('+c+'). You are now a ghost.');run(sb.from('players').update({alive:false,ready:true}).match(key()))}
function pub(){const w=st.m*(.7+Math.random()*.6),t=w<0?'in debt':w<5e3?'broke':w<5e4?'$':w<3e5?'$$':w<2e6?'$$$':'$$$$';
 run(sb.from('players').update({pub:{age:st.age,job:st.job,wealth:t}}).match(key()))}
const ready=()=>run(sb.from('players').update({ready:true}).match(key()));
function host(){if(!party||party.status!=='playing'||!st)return;
 const a=players.filter(p=>p.alive),any=a.some(p=>p.ready),all=a.every(p=>p.ready),m=mine();
 const left=party.deadline?Math.ceil((new Date(party.deadline)-Date.now())/1000):null;
 $('#cd').textContent=left===null?'':left>0?`Auto-pick in ${left}s`:'Time!';
 if(left!==null&&left<=0&&!st.dead){if(ev)pickChoice(0);else if(m&&!m.ready)ready()}
 if(party.host_id===me&&!flipping){
  if(any&&!party.deadline){party.deadline=new Date(Date.now()+60000).toISOString();run(sb.from('parties').update({deadline:party.deadline}).eq('id',party.id))}
  if(a.length&&(all||(left!==null&&left<-2)))flip()}}
async function flip(){flipping=true;const y=party.year+1;
 if(y>=party.end_age)await sb.from('parties').update({status:'ended',year:y}).eq('id',party.id);
 else{let w=party.world||{};if(Math.random()<.3){const abs=Math.random()<.12,l=WORLD.map((e,i)=>[e,i]).filter(([e])=>!!e.abs===abs);w={y,i:l[Math.floor(Math.random()*l.length)][1]}}
  await sb.from('players').update({ready:false}).eq('party_id',party.id).eq('alive',true);
  await sb.from('parties').update({year:y,deadline:null,world:w}).eq('id',party.id)}
 flipping=false}
function drawGame(){if(!st)return;
 $('#agel').textContent='Age '+st.age;$('#jobl').textContent=st.dead?'Ghost 👻':st.job;
 $('#cash').textContent=money(st.m);$('#cash').style.color=st.m<0?'var(--h)':'var(--m)';
 $('#bars').innerHTML=[['❤️ Health','h'],['😊 Happiness','p'],['🧠 Smarts','s']].map(([l,k])=>`<div class="bar"><span>${l}</span><div><i style="width:${st[k]}%;background:var(--${k})"></i></div><b>${st[k]}</b></div>`).join('');
 $('#feed').innerHTML=st.log.map(x=>`<p><b>${x.y}</b>${esc(x.t).replace(/\n/g,'<br>')}</p>`).join('');
 const e=$('#evc');e.hidden=!ev;if(ev)e.innerHTML=`<p>${esc(ev.t)}</p>`+ev.c.map((c,i)=>`<button class="btn ch" data-i="${i}">${esc(c[0])}</button>`).join('');
 draw()}
function draw(){if(!party)return;const m=mine();
 $('#rname').textContent=party.name+' ('+party.end_age+' years)';
 $('#rplayers').innerHTML=players.map(p=>`<div class="pl"><span><span class="av" style="background:${p.color}">${p.emoji}</span>${esc(p.name)}${p.user_id===party.host_id?' 👑':''}</span></div>`).join('');
 $('#start').hidden=party.host_id!==me;
 $('#roster').innerHTML=players.map(p=>`<span class="chip ${p.ready?'rdy':''} ${p.alive?'':'dead'}" style="border-color:${p.color}">${p.emoji} ${esc(p.name)}<i>${p.alive?esc((p.pub.job||'Baby')+' '+(p.pub.wealth||'')):'ghost 👻'}</i></span>`).join('');
 const b=$('#next');b.disabled=!m||!m.alive||m.ready||!!ev||!st;
 b.textContent=!m?'':!m.alive?'You are a ghost 👻':m.ready?'Waiting for others…':ev?'Make your choice first':'Next year';
 if(party.status==='ended')rank()}
const score=f=>Math.round(clamp(20*Math.log10(1+Math.max(0,f.m)/1000))+f.h+f.p+f.s);
async function finalize(){if(!st||st.fin)return;st.fin=1;const m=mine();await sb.from('players').update({pub:{...(m?m.pub:{}),final:{m:st.m,h:st.h,p:st.p,s:st.s}}}).match(key())}
function rank(){const r=players.map(p=>({p,f:p.pub&&p.pub.final})).sort((a,b)=>(b.f?score(b.f):-1)-(a.f?score(a.f):-1));
 $('#rank').innerHTML=r.map((x,i)=>`<div class="card pl"><span><b>${i+1}.</b> <span class="av" style="background:${x.p.color}">${x.p.emoji}</span><b>${esc(x.p.name)}</b>${x.f?`<div class="mut">${money(x.f.m)}  ❤️${x.f.h} 😊${x.f.p} 🧠${x.f.s}</div>`:'<div class="mut">waiting…</div>'}</span><b class="sc">${x.f?score(x.f):'…'}</b></div>`).join('');
 const m=mine();if(st&&m){const n=esc(m.name),r2=st.m>2e5?'a very attentive tax lawyer':st.m>0?'a modest savings account and unresolved opinions':'creditors, who will attend';
  $('#obit').innerHTML=`<h3>🪦 In memory of ${n}</h3><p>${n}, ${st.age}, ${st.dead?'died of '+st.cause:'crossed the finish line'}. Known as a ${esc(st.job.toLowerCase())} with ${st.h>70?'suspiciously good health':st.h>35?'average health':'a medical chart longer than a novel'} and ${st.p>70?'a strangely happy outlook':'a complicated outlook'}. Survived by ${r2}.</p>`}}
const addChat=m=>{const d=document.createElement('div');d.innerHTML=`<b>${esc(m.name)}</b> ${esc(m.body)}`;$('#chat').append(d);$('#chat').scrollTop=1e6};
async function send(){const b=$('#cin').value.trim();if(!b||!party)return;$('#cin').value='';await run(sb.from('chat').insert({party_id:party.id,user_id:me,name:LS.name||'?',body:b}))}
async function leave(gone){if(party&&!gone){if(party.host_id===me&&party.status==='lobby')await sb.from('parties').delete().eq('id',party.id);else await sb.from('players').delete().match(key())}
 if(ch)sb.removeChannel(ch);if(party)delete LS['st'+party.id];ch=party=st=ev=null;players=[];lastY=-1;delete LS.party;show('s-lobby');lobby()}
$('#emojis').onclick=x=>{const i=x.target.dataset.e;if(i!==undefined){emoji=+i;LS.emoji=i;drawEm()}};
$('#len').oninput=()=>$('#lenv').textContent=$('#len').value;
$('#plist').onclick=e=>{const j=e.target.dataset.j;j&&join(j)};
$('#mk').onclick=async()=>{const n=nm();if(!n)return say('Pick a name first.');
 const{data,error}=await sb.from('parties').insert({name:$('#pname').value.trim()||n+"'s party",host_id:me,end_age:+$('#len').value}).select().single();
 if(error)return say(error.message);join(data.id)};
$('#start').onclick=()=>run(sb.from('parties').update({status:'playing',year:0}).eq('id',party.id));
$('#leave').onclick=()=>leave();$('#home').onclick=()=>leave();$('#next').onclick=ready;
$('#evc').onclick=e=>{const i=e.target.dataset.i;if(i!==undefined&&ev)pickChoice(+i)};
$('#csend').onclick=send;$('#cin').onkeydown=e=>e.key==='Enter'&&send();
init();
</script></body></html>
